<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">MFA push notification illustration</title>
  <desc id="desc">A phone receives a push prompt with approve and deny buttons plus number matching.</desc>
  <rect width="900" height="520" rx="24" fill="#f8fafc"/>
  <rect x="120" y="54" width="300" height="412" rx="38" fill="#111827"/>
  <rect x="144" y="94" width="252" height="324" rx="20" fill="#f1f5f9"/>
  <rect x="168" y="128" width="204" height="168" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="270" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Login request</text>
  <text x="270" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Chrome, Hanoi</text>
  <text x="270" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#7c3aed">42</text>
  <rect x="169" y="326" width="94" height="48" rx="12" fill="#dc2626"/>
  <text x="216" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Deny</text>
  <rect x="277" y="326" width="94" height="48" rx="12" fill="#16a34a"/>
  <text x="324" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Approve</text>
  <path d="M493 170c42 16 69 48 69 91s-27 75-69 91" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round"/>
  <path d="M537 135c67 28 110 72 110 126s-43 98-110 126" fill="none" stroke="#bae6fd" stroke-width="16" stroke-linecap="round"/>
  <rect x="682" y="168" width="112" height="184" rx="16" fill="#0f172a"/>
  <rect x="704" y="198" width="68" height="124" rx="8" fill="#ecfeff"/>
  <text x="738" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0369a1">42</text>
</svg>
