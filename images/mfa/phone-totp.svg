<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Phone TOTP code illustration</title>
  <desc id="desc">A smartphone showing a six-digit time-based one-time password and a countdown ring.</desc>
  <rect width="900" height="520" rx="24" fill="#f8fafc"/>
  <rect x="132" y="54" width="282" height="412" rx="38" fill="#111827"/>
  <rect x="156" y="94" width="234" height="324" rx="20" fill="#ecfeff"/>
  <circle cx="273" cy="442" r="12" fill="#475569"/>
  <text x="273" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Authenticator</text>
  <rect x="186" y="205" width="174" height="80" rx="16" fill="#0891b2"/>
  <text x="273" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">482109</text>
  <path d="M273 341m-42 0a42 42 0 1184 0 42 42 0 11-84 0" fill="none" stroke="#bae6fd" stroke-width="14"/>
  <path d="M273 299a42 42 0 0139 58" fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round"/>
  <text x="273" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0369a1">18s</text>
  <rect x="502" y="142" width="266" height="66" rx="12" fill="#dbeafe"/>
  <text x="635" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Same secret + same time</text>
  <path d="M428 242h52" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M470 218l34 24-34 24" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="270" width="232" height="120" rx="18" fill="#0f172a"/>
  <text x="636" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Server validates</text>
  <text x="636" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">current 30s window</text>
