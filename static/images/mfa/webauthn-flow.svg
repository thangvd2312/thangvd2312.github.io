<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">WebAuthn public key flow illustration</title>
  <desc id="desc">Browser, authenticator, and server exchange a challenge and signed assertion.</desc>
  <rect width="900" height="520" rx="24" fill="#f8fafc"/>
  <rect x="72" y="152" width="190" height="210" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="8"/>
  <text x="167" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Browser</text>
  <rect x="356" y="152" width="190" height="210" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="8"/>
  <text x="451" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#92400e">Passkey /</text>
  <text x="451" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#92400e">Security key</text>
  <rect x="640" y="152" width="190" height="210" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="8"/>
  <text x="735" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#166534">Server</text>
  <path d="M640 202H546" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M561 178l-34 24 34 24" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="593" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">challenge</text>
  <path d="M262 257h94" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M341 233l34 24-34 24" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="309" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">request</text>
  <path d="M546 313h94" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M625 289l34 24-34 24" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="593" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">signed assertion</text>
  <path d="M356 313h-94" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <path d="M277 289l-34 24 34 24" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="309" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">user presence</text>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Server stores public key, not the private key</text>
</svg>
