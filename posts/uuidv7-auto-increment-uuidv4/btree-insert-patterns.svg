<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Auto-increment vs UUIDv4 vs UUIDv7 insert patterns</title>
  <desc id="desc">Diagram comparing append-only integer inserts, random UUIDv4 inserts causing page splits, and mostly ordered UUIDv7 inserts.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111827;stroke:#334155;stroke-width:2}.h{font:700 28px system-ui,Segoe UI,Arial;fill:#f8fafc}.t{font:500 17px system-ui,Segoe UI,Arial;fill:#cbd5e1}.s{font:600 16px system-ui,Segoe UI,Arial;fill:#94a3b8}.small{font:500 14px system-ui,Segoe UI,Arial;fill:#94a3b8}.ok{fill:#22c55e}.warn{fill:#f59e0b}.bad{fill:#ef4444}.cyan{fill:#06b6d4}.purple{fill:#a78bfa}.line{stroke:#64748b;stroke-width:3;fill:none}.arrow{stroke:#22c55e;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#f59e0b;stroke-width:4;fill:none;marker-end:url(#arrow2)}.arrow3{stroke:#06b6d4;stroke-width:4;fill:none;marker-end:url(#arrow3)}.page{fill:#1e293b;stroke:#475569;stroke-width:2}.crack{stroke:#ef4444;stroke-width:4;fill:none;stroke-linecap:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/></marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#06b6d4"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="h">Primary Key ảnh hưởng trực tiếp đến B-tree index</text>
  <text x="600" y="78" text-anchor="middle" class="t">Cùng là ID, nhưng pattern insert khác nhau tạo ra chi phí database rất khác nhau</text>

  <rect x="35" y="120" width="350" height="455" rx="18" class="panel"/>
  <text x="210" y="160" text-anchor="middle" class="h">Auto-increment</text>
  <text x="210" y="188" text-anchor="middle" class="s">1, 2, 3, 4... append vào cuối</text>
  <rect x="70" y="245" width="70" height="62" rx="10" class="page"/><text x="105" y="282" text-anchor="middle" class="t">1-3</text>
  <rect x="150" y="245" width="70" height="62" rx="10" class="page"/><text x="185" y="282" text-anchor="middle" class="t">4-6</text>
  <rect x="230" y="245" width="70" height="62" rx="10" class="page"/><text x="265" y="282" text-anchor="middle" class="t">7-9</text>
  <rect x="310" y="245" width="40" height="62" rx="10" class="ok"/><text x="330" y="282" text-anchor="middle" class="t">10</text>
  <path d="M90 355 C150 400, 250 400, 335 335" class="arrow"/>
  <text x="210" y="430" text-anchor="middle" class="t">✅ Ít page split</text>
  <text x="210" y="462" text-anchor="middle" class="t">✅ Index gọn, cache tốt</text>
  <text x="210" y="494" text-anchor="middle" class="t">⚠️ Dễ đoán, khó phân tán</text>

  <rect x="425" y="120" width="350" height="455" rx="18" class="panel"/>
  <text x="600" y="160" text-anchor="middle" class="h">UUIDv4</text>
  <text x="600" y="188" text-anchor="middle" class="s">Random 128-bit, insert rải rác</text>
  <rect x="465" y="238" width="72" height="62" rx="10" class="page"/><text x="501" y="275" text-anchor="middle" class="small">a13</text>
  <rect x="550" y="238" width="72" height="62" rx="10" class="page"/><text x="586" y="275" text-anchor="middle" class="small">f92</text>
  <rect x="635" y="238" width="72" height="62" rx="10" class="page"/><text x="671" y="275" text-anchor="middle" class="small">09c</text>
  <rect x="512" y="330" width="72" height="62" rx="10" class="warn"/><text x="548" y="367" text-anchor="middle" class="small">new</text>
  <path d="M550 300 L535 325 L560 350 L545 388" class="crack"/>
  <path d="M615 300 L640 326 L620 353 L655 390" class="crack"/>
  <path d="M705 215 C610 225, 505 300, 548 330" class="arrow2"/>
  <text x="600" y="430" text-anchor="middle" class="t">✅ Sinh ID phi tập trung</text>
  <text x="600" y="462" text-anchor="middle" class="t">✅ Khó đoán</text>
  <text x="600" y="494" text-anchor="middle" class="t">❌ Page split + fragmentation</text>

  <rect x="815" y="120" width="350" height="455" rx="18" class="panel"/>
  <text x="990" y="160" text-anchor="middle" class="h">UUIDv7</text>
  <text x="990" y="188" text-anchor="middle" class="s">Timestamp + random bits</text>
  <rect x="850" y="245" width="78" height="62" rx="10" class="page"/><text x="889" y="275" text-anchor="middle" class="small">t1+r</text>
  <rect x="940" y="245" width="78" height="62" rx="10" class="page"/><text x="979" y="275" text-anchor="middle" class="small">t2+r</text>
  <rect x="1030" y="245" width="78" height="62" rx="10" class="cyan"/><text x="1069" y="275" text-anchor="middle" class="small">t3+r</text>
  <path d="M865 355 C940 405, 1035 398, 1080 324" class="arrow3"/>
  <text x="990" y="430" text-anchor="middle" class="t">✅ Gần append-only như integer</text>
  <text x="990" y="462" text-anchor="middle" class="t">✅ Sinh phân tán như UUID</text>
  <text x="990" y="494" text-anchor="middle" class="t">✅ Khó đoán hơn auto-increment</text>
</svg>
